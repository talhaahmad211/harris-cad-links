<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open Harris account</title>
<style>
  body{font-family:system-ui,Arial,sans-serif;margin:0;padding:48px 16px;background:#f6f7f9;color:#1c1d1f}
  main{max-width:560px;margin:0 auto;background:#fff;border:1px solid #d9dce1;border-radius:8px;padding:28px}
  h1{font-size:20px;margin:0 0 12px}
  p{line-height:1.5;margin:8px 0}
  code{background:#eef0f3;padding:1px 5px;border-radius:4px}
  a{color:#0b5cad}
</style>
</head>
<body>
<main>
  <h1 id="title">Opening account&hellip;</h1>
  <p id="msg">Looking up the account on the Harris County Truth-in-Taxation portal.</p>
</main>
<script>
/* Link format:  cad.html?acct=<account number as on the roll, 13 digits>
   The portal's account page needs an internal ID that is renumbered whenever the portal reloads its data, so it can
   never be written into a spreadsheet. This page looks the ID up when the link is opened and forwards there.
   Business personal property is listed on the portal by its 7-digit HCAD number (roll account '2' + 7 digits + '00000').
   The API address and the public client credential below are the ones the portal's own web page uses. */
(function () {
  var API = "https://prod-container.trueprodigyapi.com";
  var PORTAL = "https://harris.trueprodigy-taxtransparency.com";
  var BASIC = "Basic dGF4VHJhbnNwYXJlbmN5OipNaXJzV3RDcSVjckAhMQ==";
  var title = document.getElementById("title"), msg = document.getElementById("msg");

  function fail(t, html) { title.textContent = t; msg.innerHTML = html; }
  var searchLink = '<a href="' + PORTAL + '/taxTransparency/propertySearch">Open the portal search page</a>';

  var acct = (new URLSearchParams(location.search).get("acct") || "").trim();
  if (!/^\d{7,13}$/.test(acct)) {
    fail("Account number missing", "This link needs an account number, e.g. <code>?acct=0010470000006</code>. " + searchLink + ".");
    return;
  }
  var key = /^2\d{7}0{5}$/.test(acct) ? acct.slice(1, 8) : acct;

  fetch(API + "/trueprodigy/taxtransparency/auth/token", {
    method: "POST", headers: { "Authorization": BASIC, "Content-Type": "application/json" },
    body: JSON.stringify({ office: "Harris" })
  }).then(function (r) { if (!r.ok) throw new Error("auth " + r.status); return r.json(); })
  .then(function (j) {
    return fetch(API + "/taxtransparency/property/search?page=1&pageSize=25", {
      method: "POST", headers: { "Authorization": j.user.token, "Content-Type": "application/json" },
      body: JSON.stringify({ queryString: key })
    });
  })
  .then(function (r) { if (r.status === 204) return { results: [] }; if (!r.ok) throw new Error("search " + r.status); return r.json(); })
  .then(function (j) {
    var hits = (j.results || []).filter(function (x) { return String(x.accountNumber) === key; })
                                .sort(function (a, b) { return a.propID - b.propID; });
    if (!hits.length) {
      fail("Account not on the 2026 portal",
           "The county's 2026 Truth-in-Taxation portal has no page for account <code>" + acct + "</code> (accounts without a 2026 appraisal record are not listed). " + searchLink + ".");
      return;
    }
    location.replace(PORTAL + "/taxTransparency/property/" + hits[0].propID + "/" + hits[0].ownerID);
  })
  .catch(function (e) {
    fail("Could not reach the portal", "The lookup failed (" + e.message + "). Reload this page to try again, or " + searchLink.replace("Open", "open") + ".");
  });
})();
</script>
</body>
</html>
